<style>
/* Layout: phone-first app shell. Four tabs (Today, Path, Practices, You) above a fixed tab bar; a full-screen session player steps through one item at a time. */
:root {
  --bg: #f2f4ee;          /* pale loess field */
  --surface: #fbfcf8;
  --raised: #ffffff;
  --ink: #1d2721;
  --muted: #5d6a61;
  --line: #d9ded2;
  --accent: #9a6b17;      /* ripe wheat */
  --accent-ink: #fbfcf8;
  --accent-soft: #f1e5c8;
  --sage: #4f7461;        /* done / calm */
  --sage-soft: #dce8df;
  --dusk: #3f5a78;        /* links */
  --shadow: 0 10px 30px rgba(29, 39, 33, .12);
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141a16; --surface: #1b231e; --raised: #212a24; --ink: #e6ebe3; --muted: #9daa9f; --line: #2d3a32;
  --accent: #d9a84a; --accent-ink: #1b1608; --accent-soft: #3a3020; --sage: #85b49b; --sage-soft: #24362b; --dusk: #9cb8d8;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141a16; --surface: #1b231e; --raised: #212a24; --ink: #e6ebe3; --muted: #9daa9f; --line: #2d3a32;
  --accent: #d9a84a; --accent-ink: #1b1608; --accent-soft: #3a3020; --sage: #85b49b; --sage-soft: #24362b; --dusk: #9cb8d8;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); margin: 0; }
a { color: var(--dusk); text-underline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.85rem; letter-spacing: -0.01em; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.05rem; font-family: var(--f-body); font-weight: 700; }
p { margin: 0; max-width: 62ch; }
.eyebrow { font: 500 0.72rem/1.3 var(--f-mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.stack { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* App shell */
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 14px calc(var(--tabbar) + 32px); }
.screen { display: grid; gap: 18px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 40px; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font: 500 0.85rem var(--f-mono); }
.pill svg { width: 16px; height: 16px; }
.pill.hot { background: var(--accent-soft); border-color: transparent; color: var(--ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; }
.card.hero { background: var(--raised); box-shadow: var(--shadow); border-color: transparent; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-size: 0.95rem; text-decoration: none; color: var(--ink); display: inline-flex; gap: 8px; align-items: center; justify-content: center; line-height: 1.2; min-height: 40px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.sage { background: var(--sage); border-color: var(--sage); color: var(--surface); font-weight: 700; }
.btn.big { width: 100%; min-height: 52px; font-size: 1.05rem; border-radius: 14px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn[disabled] { opacity: .5; cursor: default; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--dusk); text-decoration: underline; text-underline-offset: 3px; font-size: 0.9rem; }

/* Day stepper */
.stepper { display: flex; align-items: center; gap: 0; }
.stepper .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--surface); color: var(--muted); flex: none; }
.stepper .dot svg { width: 16px; height: 16px; }
.stepper .dot.done { background: var(--sage); border-color: var(--sage); color: var(--surface); }
.stepper .dot.cur { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.stepper .bar { flex: 1; height: 3px; background: var(--line); min-width: 8px; }
.stepper .bar.done { background: var(--sage); }

/* Step list */
.steps { list-style: none; margin: 0; padding: 0; display: grid; }
.step { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.step:first-child { border-top: 0; }
.step > div { min-width: 0; }
.step .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.step .ic svg { width: 18px; height: 18px; }
.step.done .ic { background: var(--sage-soft); color: var(--sage); }
.step .t { font-weight: 700; display: block; overflow-wrap: anywhere; }
.step.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.step .s { font-size: 0.85rem; color: var(--muted); display: block; }
.step .m { font: 0.82rem var(--f-mono); color: var(--muted); white-space: nowrap; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 4px; font: 0.72rem var(--f-mono); color: var(--muted); }
.wd i { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-weight: 500; color: var(--muted); background: var(--surface); }
.wd.done i { background: var(--sage); border-color: var(--sage); color: var(--surface); }
.wd.today i { border-color: var(--accent); color: var(--ink); }
.wd.rest i { border-style: dashed; }

.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--sage); border-radius: 4px; transition: width .4s; }
.note { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 0.93rem; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar); }
.tabbar a { display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 0.72rem; color: var(--muted); text-decoration: none; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--accent); font-weight: 700; }

/* Trail */
.trail { overflow-x: auto; margin-inline: -4px; }
.trail svg { display: block; width: 100%; min-width: 480px; height: auto; }
.trail .stop { cursor: pointer; outline: none; }
.trail .stop text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.wk { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; width: 100%; }
.wk > div { min-width: 0; }
.wk .n { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font: 500 1rem var(--f-mono); background: var(--bg); }
.wk.cur { border-color: var(--accent); }
.wk.done .n { background: var(--sage); color: var(--surface); }
.budget { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.budget div { background: var(--surface); padding: 10px 12px; display: grid; gap: 1px; }
.budget b { font: 500 1.05rem var(--f-mono); }
.budget small { color: var(--muted); font-size: 0.75rem; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 700; }
details ul { margin: 10px 0 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: 0.93rem; }

/* Practices tab */
.plist { display: grid; gap: 10px; }
.pr { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; }
.pr > div { min-width: 0; }
.pr .ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--sage-soft); color: var(--sage); }
.pr .ic svg { width: 20px; height: 20px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 2px; }
.stat b { font: 500 1.6rem var(--f-mono); font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 0.8rem; }
.journal { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.journal li { border-left: 3px solid var(--sage-soft); padding: 2px 0 2px 12px; }
textarea, input[type="number"], input[type="text"] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
textarea { min-height: 84px; resize: vertical; }
textarea.code { font: 0.78rem/1.4 var(--f-mono); min-height: 60px; }
.sync { display: inline-flex; align-items: center; gap: 8px; font: 0.8rem/1.3 var(--f-mono); color: var(--muted); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.sync[data-mode="cloud"] i { background: var(--sage); }
.sync[data-mode="local"] i { background: var(--accent); }

/* Session player */
.session { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); }
.s-head { max-width: 640px; width: 100%; margin: 0 auto; padding: 12px 16px 8px; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); }
.icon-btn svg { width: 22px; height: 22px; }
.segs { display: flex; gap: 4px; }
.segs span { flex: 1; height: 8px; border-radius: 4px; background: var(--line); transition: background .3s; }
.segs span.done { background: var(--sage); }
.segs span.cur { background: var(--accent); }
.s-left { font: 0.8rem var(--f-mono); color: var(--muted); white-space: nowrap; }
.s-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.s-inner { max-width: 640px; margin: 0 auto; padding: 8px 16px 20px; display: grid; gap: 14px; align-content: start; min-height: 100%; }
.s-foot { border-top: 1px solid var(--line); background: var(--surface); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.s-foot > div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.player { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
.player iframe, .player > div { width: 100%; height: 100%; border: 0; display: block; }
.reader { width: 100%; height: 62vh; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.away { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 10px; justify-items: start; }
.pos { font: 500 0.82rem var(--f-mono); color: var(--accent); }

/* Practice player */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 0.88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dial { display: grid; justify-items: center; gap: 10px; padding: 8px 0; }
.dial .ring { position: relative; width: 210px; height: 210px; max-width: 70vw; max-height: 70vw; }
.dial svg.r { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .play { position: absolute; inset: 22%; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow); }
.dial .play svg { width: 40%; height: 40%; }
.dial .time { font: 500 1.5rem var(--f-mono); font-variant-numeric: tabular-nums; }
.choices { display: grid; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 0.88rem; }
.chip[aria-pressed="true"] { background: var(--sage); border-color: var(--sage); color: var(--surface); }
.reflect { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }

/* Celebration */
.cele { display: grid; justify-items: center; text-align: center; gap: 14px; padding-top: 6vh; }
.cele svg.big { width: 140px; height: 140px; }
.cele svg.big circle.fill { stroke-dasharray: 377; stroke-dashoffset: 377; animation: ringfill 1s .1s ease-out forwards; }
@keyframes ringfill { to { stroke-dashoffset: 0; } }

/* Come-back sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.sheet > div { pointer-events: auto; max-width: 560px; margin: 0 auto; background: var(--raised); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet h3 { font-family: var(--f-display); font-size: 1.2rem; }
.sheet input[type="number"] { width: 5em; padding: 6px 8px; }
.sheet ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 40vh; overflow: auto; }
.sheet li label { display: flex; gap: 10px; align-items: flex-start; }
.sheet input[type="checkbox"] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--sage); }

footer.about { display: grid; gap: 10px; font-size: 0.86rem; color: var(--muted); }
@media (min-width: 700px) { .app { padding-top: 28px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .cele svg.big circle.fill { stroke-dashoffset: 0; } }
</style>

    let played = 0;
    const area = el('div', { class: 'stack' });
    if (modes.length > 1) inner.append(el('div', { class: 'seg', role: 'group', 'aria-label': 'How to practise' }, modes.map(([id, label]) => el('button', { 'aria-pressed': s.mode === id ? 'true' : 'false', onclick: () => { s.mode = id; renderStep(); } }, label))));
    inner.append(area);

    const mins = el('input', { type: 'number', id: 'pmins', min: 1, max: 180, value: logged ? logged.mins || p.min : (s.timerOnly ? 20 : p.then ? p.min + p.then : p.min), inputmode: 'numeric', style: 'width:5.5em' });
    const finished = (m) => { played = Math.max(played, m); mins.value = String(Math.max(+mins.value || 0, Math.round(played)) || p.min); };

    if (s.mode === 'audio') {
      const a = new Audio(abs(p.audio)); a.preload = 'metadata';
      const dl = dial(() => { if (a.paused) { a.play(); keepAwake(true); } else a.pause(); });
      const upd = () => dl.set(a.duration ? a.currentTime / a.duration : 0, a.duration ? `${mmss(a.currentTime)} / ${mmss(a.duration)}` : mmss(a.currentTime), !a.paused);
      ['timeupdate', 'play', 'pause', 'loadedmetadata'].forEach(ev => a.addEventListener(ev, upd));
      a.addEventListener('ended', () => { keepAwake(false); finished(a.duration / 60); upd(); if (p.then) area.append(el('div', { class: 'note' }, `Guidance done. Keep walking on your own for another ${p.then} minutes.`, el('div', { class: 'row', style: 'margin-top:8px' }, el('button', { class: 'btn', onclick: () => { s.mode = 'timer'; s.timerMin = p.then; renderStep(); } }, `Start a ${p.then}-minute timer`)))); });
      area.append(dl.root, el('div', { class: 'row', style: 'justify-content:center' },
        el('button', { class: 'btn ghost', onclick: () => { a.currentTime = Math.max(0, a.currentTime - 15); } }, '−15 s'),
        el('button', { class: 'btn ghost', onclick: () => { a.currentTime = Math.min(a.duration || 0, a.currentTime + 15); } }, '+15 s')));
      upd();
      media = { kind: 'audio', stop: () => { a.pause(); finished(a.currentTime / 60); keepAwake(false); } };
    } else if (s.mode === 'video') {
      const box = el('div', { class: 'player' }); area.append(box);
      const m = { kind: 'yt', player: null };
      media = { kind: 'ytp', stop: () => { try { finished(m.player.getCurrentTime() / 60); m.player.destroy(); } catch (e) {} } };
      ytPlayer(box, p.video, 0, (e, YT) => { if (e.data === YT.PlayerState.ENDED) finished(m.player.getDuration() / 60); }).then(pl => { m.player = pl; });
    } else if (s.mode === 'away') {
      area.append(el('div', { class: 'away' },
        el('p', {}, 'In the installed app the guided audio plays right here. In this preview, open it on the Palouse site, or use the timer below the line.'),
        ext('Open the guided practice', abs(p.page), null, 'btn primary')));
    } else {
      let total = (s.timerMin || (s.free && s.timerOnly ? 20 : p.then || p.min)) * 60, endAt = 0, remain = total, iv = null;
      const dl = dial(() => {
        if (iv) { remain = Math.max(0, (endAt - now()) / 1000); clearInterval(iv); iv = null; keepAwake(false); draw(); }
        else { if (remain <= 0) remain = total; if (remain === total) bell(1); endAt = now() + remain * 1000; iv = setInterval(tickT, 250); keepAwake(true); draw(); }
      });
      const draw = () => dl.set(1 - remain / total, mmss(remain), !!iv);
      const tickT = () => { remain = Math.max(0, (endAt - now()) / 1000); draw(); if (remain <= 0) { clearInterval(iv); iv = null; bell(3); keepAwake(false); finished(total / 60); draw(); } };
      const setMin = m => { if (iv) return; total = Math.max(60, Math.min(120 * 60, m * 60)); remain = total; s.timerMin = total / 60; draw(); };
      area.append(dl.root, el('div', { class: 'row', style: 'justify-content:center' },
        el('button', { class: 'btn ghost', onclick: () => setMin(total / 60 - 5) }, '−5 min'),
        el('button', { class: 'btn ghost', onclick: () => setMin(total / 60 + 5) }, '+5 min')),
        el('p', { class: 'small muted', style: 'text-align:center' }, 'A bell sounds at the start and three at the end.'));
      draw();
      media = { kind: 'timer', stop: () => { if (iv) { clearInterval(iv); finished((total - Math.max(0, (endAt - now()) / 1000)) / 60); } keepAwake(false); } };
    }

    // Reflection (the app's version of the practice sheet)
    const MOODS = ['Settled', 'Restless', 'Sleepy', 'Distracted', 'Uncomfortable', 'Kind to myself'];
    const chosen = new Set(logged ? logged.moods || [] : []);
    const note = el('textarea', { id: 'pnote', placeholder: 'Anything you noticed? (optional)', 'aria-label': 'Practice note' }); note.value = logged ? logged.note || '' : '';
    inner.append(el('div', { class: 'reflect' },
      el('h3', {}, 'After you practise'),
      el('div', { class: 'row' }, MOODS.map(m => { const b = el('button', { class: 'chip', 'aria-pressed': chosen.has(m) ? 'true' : 'false', onclick: () => { chosen.has(m) ? chosen.delete(m) : chosen.add(m); b.setAttribute('aria-pressed', chosen.has(m) ? 'true' : 'false'); } }, m); return b; })),
      note,
      el('label', { class: 'row small', for: 'pmins' }, 'Minutes practised', mins)));
    foot.logPractice = () => {
      if (media && media.stop) { media.stop(); media = null; }
      const rec = { pid: s.pid, mins: Math.max(1, Math.round(+mins.value || p.min)), moods: [...chosen], note: note.value.trim() };
      if (s.free) { logFree(s.pid, rec.mins, rec); s.logged = true; } else logDay(s.n, s.d, rec);
      commit({ render: false });
      advance();
    };
  }

  // ---- informal practice
  function stepInformal(s, inner) {
    const w = W[s.n], e = infEnt(s.n, s.d);
    inner.append(el('div', { class: 'stack', style: 'gap:6px' }, el('span', { class: 'eyebrow' }, `Informal practice · ${session.title}`), el('h2', {}, s.n === 8 ? 'Looking back' : 'Through the day'), el('p', {}, w.informal)));
    const ta = el('textarea', { id: 'inote', 'aria-label': w.prompt, placeholder: 'A sentence or two is plenty.' }); ta.value = e.note || '';
    inner.append(el('div', { class: 'reflect' }, el('h3', {}, w.prompt), ta,
      el('p', { class: 'small muted' }, 'If the moment hasn\'t happened yet, tap Tonight and come back before bed.')));
    foot.saveInformal = () => { logInf(s.n, s.d, ta.value.trim()); commit({ render: false }); advance(); };
  }

  function stopMedia() {
    if (media && media.kind === 'yt') { try { trackVideo(media); media.player && media.player.destroy(); } catch (e) {} clearInterval(media.tick); }
    else if (media && media.stop) { try { media.stop(); } catch (e) {} }
    media = null; foot.logPractice = null; foot.saveInformal = null;
  }

  function celebrate() {
    stopMedia();
    const body = document.getElementById('sbody'); body.innerHTML = '';
    const st = streak(), sess = session;
    const tomorrow = sess.kind === 'day' && sess.n && sess.d < DAYS - 1 ? `Tomorrow: Day ${sess.d + 2}, ${practiceLabel(sess.n, sess.d + 1)}.` : sess.kind === 'day' && sess.n ? `That was the last practice day of Week ${sess.n}.` : '';
    const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 140 140'); svg.setAttribute('class', 'big'); svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = '<circle cx="70" cy="70" r="60" fill="none" stroke="var(--line)" stroke-width="8"/><circle class="fill" cx="70" cy="70" r="60" fill="none" stroke="var(--sage)" stroke-width="8" stroke-linecap="round" transform="rotate(-90 70 70)"/><path d="M48 72l15 15 30-32" fill="none" stroke="var(--sage)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>';
    body.append(el('div', { class: 's-inner' }, el('div', { class: 'cele' }, svg,
      el('h1', {}, sess.kind === 'day' ? (sess.n ? `Day ${sess.d + 1} complete` : 'You\'re set up') : sess.kind === 'free' ? 'Practice logged' : 'All caught up'),
      st ? el('span', { class: 'pill hot' }, icon('leaf'), `${st}-day streak`) : null,
      tomorrow ? el('p', { class: 'muted' }, tomorrow) : null,
      sess.n === 0 && sess.kind === 'day' ? el('p', { class: 'muted' }, 'Week 1 is ready when you are.') : null)));
    updateSessionChrome();
    const f = document.getElementById('sfoot'); f.innerHTML = '';
    f.append(el('div', {}, el('span'), el('button', { class: 'btn big sage', onclick: closeSession }, 'Done')));
  }

  // ================================================================ leaving the app (preview fallback) + coming back
  function markOpened(key) {
    const it = ITEMS[key];
    S.pending = { kind: 'item', key, openedAt: now(), from: posOf(key) }; S.pendingAt = now();
    S.last = { week: it.week, label: `Opened “${it.title}”`, at: now() };
    touchWeek(it.week);
    commit({ render: false });
  }
  let sheetFor = 0;
  function closeSheet(clear) {
    document.getElementById('sheet').hidden = true;
    if (clear) { S.pending = null; S.pendingAt = now(); commit({ render: false }); }
    render();
    if (session) { renderFoot(); if (clear && stepDone(session.steps[sIdx])) advance(); else renderStep(); }
  }
  function checkPending() {
    const p = S.pending;
    if (!p || document.visibilityState === 'hidden') return;
    const age = now() - p.openedAt;
    if (age < 20000) { clearTimeout(checkPending.t); checkPending.t = setTimeout(checkPending, 20000 - age + 200); return; }
    if (sheetFor === S.pendingAt && !document.getElementById('sheet').hidden) return;
    const it = ITEMS[p.key];
    if (!it || isDone(it.key)) { S.pending = null; S.pendingAt = now(); commit({ render: false }); return; }
    sheetFor = S.pendingAt;
    const away = Math.max(1, Math.round(age / 60000));
    const body = document.getElementById('sheetBody'); body.innerHTML = '';
    const later = el('button', { class: 'linkbtn', onclick: () => { document.getElementById('sheet').hidden = true; } }, 'Ask me later');
    if (it.kind === 'video') {
      const guess = Math.max(1, Math.min(it.min - 1, Math.round((p.from || 0) / 60) + away));
      const inp = el('input', { type: 'number', id: 'stopMin', min: 0, max: it.min + 5, value: guess, inputmode: 'numeric' });
      body.append(el('h3', { id: 'sheetH' }, `Back from “${it.title}”?`),
        el('p', { class: 'small muted' }, `You opened it ${ago(p.openedAt)}${p.from ? ` at ${mmss(p.from)}` : ''}. It's ${it.min} minutes long.`),
        el('div', { class: 'row' }, el('button', { class: 'btn sage', onclick: () => { setDone(it.key); closeSheet(true); } }, 'I finished it')),
        el('div', { class: 'row' }, el('label', { for: 'stopMin', class: 'row' }, 'I stopped at', inp, 'min'), el('button', { class: 'btn', onclick: () => { setPos(it.key, (parseFloat(inp.value) || 0) * 60); closeSheet(true); } }, 'Save my place')),
        el('div', { class: 'row small' }, el('button', { class: 'linkbtn', onclick: () => closeSheet(true) }, "I didn't watch it"), ' · ', later));
    } else {
      body.append(el('h3', { id: 'sheetH' }, `Finished “${it.title}”?`), el('p', { class: 'small muted' }, `You opened it ${ago(p.openedAt)}.`),
        el('div', { class: 'row' }, el('button', { class: 'btn sage', onclick: () => { setDone(it.key); closeSheet(true); } }, 'Yes, done'), el('button', { class: 'btn', onclick: () => closeSheet(true) }, 'Not yet'), later));
    }
    document.getElementById('sheet').hidden = false;
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkPending(); else if (media && media.kind === 'yt') trackVideo(media); });
  window.addEventListener('focus', checkPending);
  window.addEventListener('pageshow', checkPending);

  // ================================================================ boot
  const local = loadLocal();
  if (local) S = merge(blank(), local);
  if (saveLocal()) mode = 'local';
  render();
  checkPending();
  initCloud();
})();
</script>
</body>
</html>
